<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#1F4E79">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="Roteiro de viagem à Paris — 5 dias">
  <title>Paris — Nossa Viagem</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header" id="app-header">
    <div class="header-inner">
      <button class="btn-back hidden" id="btn-back" aria-label="Voltar">← Voltar</button>
      <div class="header-text">
        <h1 id="page-title">Paris</h1>
        <p id="page-subtitle">Nossa viagem</p>
      </div>
    </div>
  </header>

  <main id="app-main" class="app-main"></main>

  <nav class="bottom-nav" aria-label="Menu principal">
    <button class="nav-btn active" data-view="home" aria-label="Início">
      <span class="nav-icon">🏠</span>
      <span class="nav-label">Início</span>
    </button>
    <button class="nav-btn" data-view="days" aria-label="Roteiro">
      <span class="nav-icon">📅</span>
      <span class="nav-label">Roteiro</span>
    </button>
    <button class="nav-btn" data-view="links" aria-label="Reservas">
      <span class="nav-icon">🔗</span>
      <span class="nav-label">Reservas</span>
    </button>
    <button class="nav-btn" data-view="tips" aria-label="Dicas">
      <span class="nav-icon">💡</span>
      <span class="nav-label">Dicas</span>
    </button>
  </nav>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
